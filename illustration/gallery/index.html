<style>
  :root{
    --bg:#f4f2ec; --bg2:#ece9df; --surface:#fffdf8; --surface2:#f8f5ec;
    --ink:#1c2430; --ink2:#4a5568; --muted:#7a8494; --line:#ddd6c4;
    --accent:#1d4e5f; --accent-ink:#fff; --accent-soft:#dcebe9;
    --gold:#9a7b2d; --shadow:0 10px 30px rgba(28,36,48,.14);
    --thumb-bg:#e6e1d3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d141b; --bg2:#0a1016; --surface:#141e28; --surface2:#182430;
      --ink:#e8edf2; --ink2:#b9c4d0; --muted:#8494a5; --line:#2a3a49;
      --accent:#7fd1c0; --accent-ink:#0d1a1a; --accent-soft:#1b3238;
      --gold:#d4b36a; --shadow:0 12px 34px rgba(0,0,0,.5);
      --thumb-bg:#1a2733;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);
    font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;line-height:1.65}
  button,[role="button"],select,input{font:inherit}
  button{min-height:40px}
  a{color:var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 64px}

  header.hero{padding:34px 0 8px}
  .hero-top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:18px}
  h1{font-family:"Noto Serif JP",serif;font-size:clamp(26px,5vw,40px);line-height:1.25;margin:0;font-weight:700;letter-spacing:.02em}
  h1 .en{display:block;font-family:"Marcellus",serif;font-size:.52em;letter-spacing:.22em;color:var(--accent);font-weight:400;margin-bottom:6px}
  .hero-meta{text-align:right;font-size:13px;color:var(--ink2)}
  .hero-meta strong{font-size:22px;color:var(--ink);font-family:"Marcellus",serif;letter-spacing:.04em}
  .hero-note{margin:14px 0 0;color:var(--ink2);font-size:14px;max-width:760px}
  .hero-note a{font-weight:700}

  .toolbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);padding:14px 0 10px;margin-top:10px}
  .toolbar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px}
  .search input{flex:1;border:0;background:transparent;color:var(--ink);min-height:36px;outline:none;font-size:15px}
  .search input::placeholder{color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px;font-weight:500}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
  .count-line{font-size:13px;color:var(--muted);margin:8px 2px 0}

  section.month{margin-top:26px}
  .month-head{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
  .month-head h2{font-family:"Marcellus","Noto Serif JP",serif;font-size:20px;letter-spacing:.08em;margin:0}
  .month-head span{font-size:12.5px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}
  .card{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease, box-shadow .15s ease}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .thumb-btn{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;text-align:left}
  .thumb-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .thumb{position:relative;background:var(--thumb-bg);aspect-ratio:4/5;overflow:hidden;display:block}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .open-btn{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;text-align:left;color:inherit}
  .dl-btn{margin-top:9px;align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;min-height:38px}
  .dl-btn:hover{background:var(--accent);color:var(--accent-ink)}
  .dl-btn:disabled{opacity:.6;cursor:wait}
  .badge{position:absolute;top:8px;right:8px;background:rgba(10,18,24,.78);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;letter-spacing:.03em}
  .badge.dl-hint{top:auto;bottom:8px;right:8px;background:var(--accent);color:var(--accent-ink)}
  @media (prefers-color-scheme: light){.badge.dl-hint{color:#fff}}
  .card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
  .card-title{font-family:"Marcellus",serif;font-size:14.5px;letter-spacing:.05em;line-height:1.35;word-break:break-word}
  .card-cap{font-size:13.5px;color:var(--ink);font-weight:500;line-height:1.45}
  .card-title + .card-cap{color:var(--ink2);font-weight:400}
  .card-date{margin-top:auto;padding-top:6px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .empty{display:none;text-align:center;color:var(--muted);padding:48px 16px;font-size:14.5px}
  .empty.show{display:block}

  footer{margin-top:44px;border-top:1px solid var(--line);padding-top:16px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}

  /* ---- viewer ---- */
  .overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(6,10,14,.92);color:#eef3f6}
  .overlay.open{display:flex;flex-direction:column}
  .ov-top{display:flex;align-items:center;gap:10px;padding:10px 14px}
  .ov-top .spacer{flex:1}
  .ov-btn{appearance:none;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
  .ov-btn:hover{background:rgba(255,255,255,.18)}
  .ov-btn.primary{background:#7fd1c0;border-color:#7fd1c0;color:#0b1c1c}
  .ov-btn.primary:hover{background:#97decf}
  .ov-btn:disabled{opacity:.55;cursor:wait}
  .ov-counter{font-family:"Marcellus",serif;letter-spacing:.1em;font-size:14px;color:#c7d3dc;white-space:nowrap}
  .ov-stage{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:0;padding:0 6px}
  .nav-btn{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .nav-btn:hover{background:rgba(255,255,255,.2)}
  .nav-btn:disabled{opacity:.3;cursor:default}
  .ov-fig{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;height:100%}
  .ov-fig img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .ov-info{padding:14px 18px calc(16px + env(safe-area-inset-bottom));background:rgba(10,17,23,.96);border-top:1px solid rgba(255,255,255,.12);max-height:38vh;overflow:auto}
  .ov-info-inner{max-width:820px;margin:0 auto}
  .ov-title{font-family:"Marcellus",serif;font-size:clamp(19px,3.4vw,27px);letter-spacing:.06em;margin:0;line-height:1.3;word-break:break-word}
  .ov-cap{font-family:"Noto Serif JP",serif;font-size:clamp(16px,2.6vw,20px);margin:4px 0 0;font-weight:700}
  .ov-note{white-space:pre-wrap;font-size:14px;color:#c2ced8;margin:10px 0 0;line-height:1.7;word-break:break-word}
  .ov-meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:12px;font-size:13px;color:#93a5b3}
  .ov-meta a{color:#7fd1c0;font-weight:700}
  .img-dots{display:flex;gap:7px;justify-content:center;padding:8px 0 0}
  .img-dots button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:transparent;color:#dbe6ee;font-size:13px;cursor:pointer;padding:0;min-height:36px}
  .img-dots button[aria-current="true"]{background:#7fd1c0;border-color:#7fd1c0;color:#0b1c1c;font-weight:700}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#10222b;color:#eaf6f3;border:1px solid rgba(127,209,192,.5);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:92vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:560px){
    .hero-meta{text-align:left}
    .nav-btn{width:44px;height:44px}
    .ov-top{flex-wrap:wrap}
    .ov-btn{padding:8px 13px;font-size:13.5px}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <h1><span class="en">ILLUSTRATION ARCHIVE</span>投稿イラストギャラリー</h1>
      <div class="hero-meta">
        <div><strong id="statPosts">–</strong> 投稿 ／ <strong id="statImgs">–</strong> 枚</div>
        <div id="statRange">—</div>
      </div>
    </div>
    <p class="hero-note">雑葉（ざつは）／ <a href="https://x.com/sacher10610" target="_blank" rel="noopener">@sacher10610</a> のX投稿イラストをまとめたアーカイブです。サムネイルをタップすると拡大表示になります。各カードや拡大画面の「拡大表示」ボタンからは、原寸画像を別画面で開けます。</p>
  </header>

  <div class="toolbar">
    <div class="toolbar-row">
      <label class="search" aria-label="検索">
        <span aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="タイトル・キャプション・本文で検索" autocomplete="off">
      </label>
      <div class="chips" id="chips" role="group" aria-label="月で絞り込み"></div>
    </div>
    <p class="count-line" id="countLine" aria-live="polite"></p>
  </div>

  <main id="gallery"></main>
  <p class="empty" id="emptyMsg">条件に合う投稿がありません。検索ワードや月の絞り込みを変えてみてください。</p>

  <footer>
    <span>出典：X（@sacher10610）の投稿。各イラストの「Xで見る」から元の投稿へ移動できます。</span>
    <span>画像の権利は投稿者に帰属します。</span>
  </footer>
</div>

<!-- ===== 拡大ビューア ===== -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="イラスト拡大表示">
  <div class="ov-top">
    <button class="ov-btn" id="btnClose" type="button">✕ 閉じる</button>
    <span class="ov-counter" id="ovCounter"></span>
    <span class="spacer"></span>
    <button class="ov-btn primary" id="btnDownload" type="button">原寸で拡大表示 ↗</button>
    <a class="ov-btn" id="ovXLink" href="#" target="_blank" rel="noopener">Xで見る ↗</a>
  </div>
  <div class="ov-stage">
    <button class="nav-btn" id="btnPrevPost" type="button" aria-label="前の投稿">‹</button>
    <figure class="ov-fig" style="margin:0"><img id="ovImg" alt=""></figure>
    <button class="nav-btn" id="btnNextPost" type="button" aria-label="次の投稿">›</button>
  </div>
  <div class="img-dots" id="imgDots" aria-label="この投稿の画像"></div>
  <div class="ov-info">
    <div class="ov-info-inner">
      <h2 class="ov-title" id="ovTitle"></h2>
      <p class="ov-cap" id="ovCap"></p>
      <p class="ov-note" id="ovNote"></p>
      <div class="ov-meta">
        <span id="ovDate"></span>
        <span id="ovImgPos"></span>
        <span>◀ ▶ キー：前後の投稿 ／ Esc：閉じる</span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

面図 / エディトリアルポスター / 世界観設定画を融合した完成度の高い一枚絵としてください。\nこの作品では「人物を描く」のではなく「人物そのものを空間化する」ことを最優先してください。/ キャラクターの性格・趣味・職業・日常・象徴モチーフ・好きなもの・夢・悩み・将来性などを読み取り、それらを建築 / 部屋 / 階層 / 家具 / 小物 / 収納 / モニター / 標識 / 植物 / 照明 / 色 / 図形 / 文字 / 階段 / 通路 / ゲート / 窓 / 展示物などへ変換してください。/ 背景はキャラクターの後ろに置く装飾ではなく、キャラクター設定そのものを立体化した世界として設計してください。\n幾何学は単なる装飾として使用せず、画面全体の文法として使用してください。/ 立方体 / 直方体 / 階段 / 円 / 円弧 / 長方形 / グリッド / 垂直線 / 水平線 / 斜線 / 反復構造 / 面積比 / 空間分割 / 余白によって画面全体を設計してください。/ 人物・建築・家具・光・タイポグラフィ・小物・余白が、すべて一つの幾何学構成として成立すること。/ 図形を後から追加するのではなく、最初に画面を幾何学的に設計し、その構造の中へ人物と世界観を組み込んでください。\n画面は縦方向に複数のゾーンまたは階層へ分け、基本は3層構成としてください。/ 01 LIVING ZONE＝キャラクターの日常生活を象徴する空間。玄関 / ベッド / 食事 / 収納 / 生活用品 / 普段着 / 日常的な小物などを用い、「いつもの日常」を表現してください。/ 02 HOBBY or WORK ZONE＝キャラクターの趣味・仕事・専門性・好きなものを最も濃く表現する空間。PC / 本 / 楽器 / 工具 / 配信機材 / コレクション / 衣装 / 武器 / 研究設備 / 美術用品 / ゲーム / 写真 / 料理 / 植物など、その人物を作っているものを空間化してください。/ 03 DREAM ZONE＝キャラクターの夢・理想・未来・別世界・象徴世界を表現する空間。巨大ゲート / 異世界 / 空 / 都市 / 星 / 海 / 光 / 幻想建築 / 抽象世界などを用い、「この人物がまだ辿り着いていない場所」を描いてください。\nメイン人物は画面中央付近の中層に配置してください。/ ただし画面の主役は人物だけではありません。/ 人物サイズは全体の箱庭構造・建築・各階層が十分に見える大きさとし、巨大化させすぎないでください。/ 中央人物は椅子・床・ベッド・階段・手すりなどの空間要素と自然に関係するポーズにしてください。/ 必要に応じて同一人物を遠景の小さな後ろ姿 / モニター / 鏡 / 窓 / ポスター / シルエットなどとして小さく再登場させても構いませんが、同一場面に複数の実体人物が存在しているように見せないでください。\n添付キャラクターから性格 / 趣味 / 仕事 / モチーフ / 象徴色 / 印象 / 世界観 / 生活スタイル / 将来性を読み取り、それぞれを空間要素へ変換してください。/ 例：ゲーム好き→PC / コントローラー / UI / レベル表示 / デジタル照明。/ 読書好き→本棚 / 書斎 / 紙 / 活字 / 静かな照明。/ 音楽好き→楽器 / スピーカー / 波形 / レコード / ライブ空間。/ 錬金術師→実験室 / ガラス器具 / 金属 / 歯車 / 発光液体。/ ダンサー→ミラー / 床 / 音響 / ステージ / 動線。/ キャラクターごとに固有の変換を行ってください。\n配色は添付キャラクターから2〜5色程度の主要色を抽出してください。/ 基本構成は黒または濃色 / 白または紙色 / キャラクター由来の主色 / 補助色 / 少量のアクセント色。/ 高彩度色は広範囲に使用せず、視線誘導・象徴・発光・重要箇所に限定してください。/ 全体は低彩度 / 高コントラスト / 整理された色面を基本としてください。\n箱庭・建築模型的な読みやすさを保ちつつ、ガラス反射 / 発光 / リムライト / 小さな間接照明 / 空気遠近 / ごく薄い霧 / 控えめなブルームを使用してください。/ ただし幻想演出を強くしすぎて建築構造が見えなくならないようにしてください。\n情報量は多くしてください。/ ただし高密度＝無秩序にしてはいけません。/ 小物はキャラクターの設定・テーマ・趣味に関係するもののみ配置し、意味のない装飾物で埋めないでください。/ 画面を見るたびに「この小物には意味がある」「この空間はこの人物の性格を表している」と感じられる設計にしてください。\n必要に応じてエディトリアルデザインとして文字を配置してください。/ キャラクター名 / 英語タイトル / Zone番号 / Zone名称 / 短いキャッチコピー / 小さな設定文 / システム表示風文字などを使用できます。/ 文字は装飾ではなく、画面設計・世界観説明・階層整理の一部として使用してください。/ 文字量は多すぎないこと。\n作品に英語タイトルを1つ自動生成してください。/ タイトルはキャラクター名＋空間 / 世界 / 生態 / 領域 / 内面を連想できるものを優先してください。/ 例：Parallel Habitat / Inner Architecture / Personal Universe / Private Orbit / Layered Self / Another Room / Memory Structure / Dream Habitat。/ キャラクター固有の設定に応じて新しいタイトルを生成してください。\n4:5縦構図。/ アイソメトリックまたは斜め俯瞰寄りの視点。/ 完全な真上視点は禁止。/ 建築物全体がひとつの巨大な幾何学オブジェクトとして見えるようにしてください。/ 外周には適度な余白を設け、タイトル / Zone表示 / 補助情報 / 線 / 数字 / 小さな記号を配置してください。/ 画面中央に情報を集中させ、周囲には呼吸できる余白を残してください。\n描画は高品質アニメ表現。/ 人物は繊細 / フラット寄り / 線は整理 / 顔は最優先 / キャラクター性を維持。/ 背景は高密度 / 建築的 / 精密 / 幾何学的 / ただし読みやすく。/ 全体としてアニメイラスト × 建築ビジュアライゼーション × エディトリアルグラフィックの中間を狙ってください。\n人物を巨大化しすぎない / キャラだけを主役にしない / 普通の部屋背景にしない / 図形を単なる飾りにしない / 小物を無意味に大量配置しない / 背景をぼかしすぎない / 建築構造を崩さない / 手足を増やさない / 腕・手・指の重複禁止 / 両手の接続位置を明確にする / 片手5本指 / 左右の手を混同しない / 同一人物の身体パーツを重複させない / 余計な腕・脚・指を生成しない / 遠景人物とメイン人物を融合させない / 不自然な人体遠近を避ける。\n最終的に「このキャラクターが住んでいる場所」ではなく「このキャラクター自身を建築した世界」に見えること。/ 人物・建築・小物・趣味・夢・文字・光・幾何学が一体化し、一枚を長時間探索したくなる、高密度だが整理された“キャラクター生態系ポスター”として完成させてください。\nキャラクター名：\nプロフィール：\n特に重要なモチーフ：\n希望：","images":["https://pbs.twimg.com/media/HR5NE3oawAAJKw5?format=jpg&name=small","https://pbs.twimg.com/media/HR5NJv1aAAAoFlx?format=jpg&name=small"]},{"date":"2026-09-11","postUrl":"https://x.com/sacher10610/status/2098194807520903678","title":"","caption":"動画作るときに作成したコンセプトアートももしよかったらどうぞ✨✨","note":"","images":["https://pbs.twimg.com/media/HR5IIdBawAAIZKB?format=jpg&name=small","https://pbs.twimg.com/media/HR5IaSJaQAA6Atx?format=jpg&name=small","https://pbs.twimg.com/media/HR5Ic_VakAA3psP?format=jpg&name=small"]},{"date":"2026-09-11","postUrl":"https://x.com/sacher10610/status/2098184752473805309","title":"Lost in the Feed","caption":"#Aiart #残念院さん @Vtuber7144","note":"","images":["https://pbs.twimg.com/media/HR32BwHasAAszrn?format=jpg&name=small"]},{"date":"2026-09-11","postUrl":"https://x.com/sacher10610/status/2098169654992925055","title":"","caption /* ---------- ユーティリティ ---------- */
function origUrl(u){ return u.replace(/([?&])name=(small|900x900|medium|large)/, '$1name=orig'); }
function fmtDate(d){ var p=d.split('-'); return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日'; }
function monthKey(d){ return d.slice(0,7); }
function monthLabel(k){ var p=k.split('-'); return p[0]+'年 '+(+p[1])+'月'; }
function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* ---------- singleImage（分割イラストの結合済み1枚絵） ---------- */
function hasSingle(p){ return !!(p && p.singleImage); }
function singleSrc(p){ return 'assets/' + p.singleImage; }
function isJoined(p){ return !!(p && p.joined && p.images && p.images.length>1); }
function joinCols(p){ var n=parseInt(p&&p.joinCols,10); return (n&&n>0) ? n : (p.images ? p.images.length : 0); }
/* ---------- 統計 ---------- */
var totalImgs = POSTS.reduce(function(n,p){ return n+p.images.length; },0);
document.getElementById('statPosts').textContent = POSTS.length;
document.getElementById('statImgs').textContent = totalImgs;
var dates = POSTS.map(function(p){return p.date;}).sort();
document.getElementById('statRange').textContent = fmtDate(dates[0])+' 〜 '+fmtDate(dates[dates.length-1]);

/* ---------- 月チップ ---------- */
var months = [];
POSTS.forEach(function(p){ var k=monthKey(p.date); if(months.indexOf(k)<0) months.push(k); });
months.sort().reverse();
var activeMonth = 'all';
var chipsEl = document.getElementById('chips');
function renderChips(){
  chipsEl.innerHTML='';
  var defs = [{k:'all', label:'すべて'}].concat(months.map(function(k){return {k:k,label:monthLabel(k)};}));
  defs.forEach(function(d){
    var b=document.createElement('button');
    b.type='button'; b.className='chip'; b.textContent=d.label;
    b.setAttribute('aria-pressed', activeMonth===d.k ? 'true':'false');
    b.addEventListener('click', function(){ activeMonth=d.k; renderChips(); renderGallery(); });
    chipsEl.appendChild(b);
  });
}

/* ---------- 一覧描画 ---------- */
var galleryEl = document.getElementById('gallery');
var emptyEl = document.getElementById('emptyMsg');
var countEl = document.getElementById('countLine');
var query = '';
var visible = []; // 表示中リスト [{post, index}]

function matches(p){
  if(activeMonth!=='all' && monthKey(p.date)!==activeMonth) return false;
  if(!query) return true;
  var hay = (p.title+' '+p.caption+' '+p.note).toLowerCase();
  return hay.indexOf(query.toLowerCase())>=0;
}

function renderGallery(){
  visible = [];
  POSTS.forEach(function(p,i){ if(matches(p)) visible.push({post:p, index:i}); });
  galleryEl.innerHTML='';
  emptyEl.classList.toggle('show', visible.length===0);
  countEl.textContent = visible.length===0 ? '' : (visible.length+' 件の投稿を表示中（新しい順）');

  var groups = {};
  var order = [];
  visible.forEach(function(v){
    var k = monthKey(v.post.date);
    if(!groups[k]){ groups[k]=[]; order.push(k); }
    groups[k].push(v);
  });
  order.forEach(function(k){
    var sec=document.createElement('section'); sec.className='month';
    var head=document.createElement('div'); head.className='month-head';
    head.innerHTML='<h2>'+esc(monthLabel(k))+'</h2><span>'+groups[k].length+' 件</span>';
    sec.appendChild(head);
    var grid=document.createElement('div'); grid.className='grid';
    groups[k].forEach(function(v){
      var p=v.post;
      var card=document.createElement('article');
      card.className='card';
      var label = (p.title||p.caption||'イラスト');
      var alt = esc([p.title,p.caption].filter(Boolean).join(' — ') || '投稿イラスト');
      var single = hasSingle(p);
      var joined = isJoined(p);
      var cols = joined ? joinCols(p) : 0;
      var badge = single
        ? '<span class="badge">🧩 1枚絵'+(joined ? '・'+cols+'分割' : '')+'</span>'
        : (p.images.length>1 ? '<span class="badge">📷 '+p.images.length+'枚</span>' : '');
      var thumbInner = single
        ? '<img loading="lazy" src="'+esc(singleSrc(p))+'" alt="'+alt+'">'+badge
        : '<img loading="lazy" src="'+esc(p.images[0])+'" alt="'+alt+'">'+badge;
      var countText = single
        ? (joined ? ' ・ '+cols+'分割（1枚絵）' : ' ・ 1枚絵')
        : (p.images.length>1 ? ' ・ '+p.images.length+'枚' : '');
      var titleHtml = p.title ? '<div class="card-title">'+esc(p.title)+'</div>' : '';
      var capHtml = p.caption ? '<div class="card-cap">'+esc(p.caption)+'</div>' : '';
      if(!titleHtml && !capHtml) capHtml='<div class="card-cap">（タイトルなし）</div>';
      card.innerHTML =
        '<button type="button" class="thumb-btn" aria-label="'+esc(label)+' を拡大表示"><span class="thumb">'+thumbInner+'</span></button>'+
        '<div class="card-body">'+
          '<button type="button" class="open-btn" aria-label="'+esc(label)+' を拡大表示">'+titleHtml+capHtml+
          '<span class="card-date" style="display:block">'+esc(fmtDate(p.date))+countText+'</span></button>'+
          '<button type="button" class="dl-btn">拡大表示</button>'+
        '</div>';
      card.querySelector('.thumb-btn').addEventListener('click', function(){ openViewer(v.index, 0); });
      card.querySelector('.open-btn').addEventListener('click', function(){ openViewer(v.index, 0); });
      var dlBtn = card.querySelector('.dl-btn');
      if(single){
        dlBtn.addEventListener('click', function(){ openLocalFile(singleSrc(p)); });
      }else{
        dlBtn.addEventListener('click', function(){ openOriginal(p.images[0]); });
      }
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    galleryEl.appendChild(sec);
  });
}

document.getElementById('q').addEventListener('input', function(e){ query=e.target.value.trim(); renderGallery(); });

/* ---------- 原寸画像を別画面で開く ---------- */
var toastEl=document.getElementById('toast'); var toastTimer=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove('show'); }, 3200);
}

function openOriginal(smallUrl){
  window.open(origUrl(smallUrl), '_blank', 'noopener');
  toast('原寸画像を別画面で開きました');
}

function openLocalFile(src){
  window.open(src, '_blank', 'noopener');
  toast('原寸画像を別画面で開きました');
}

/* ---------- 拡大ビューア ---------- */
var overlay=document.getElementById('overlay');
var ovImg=document.getElementById('ovImg'), ovTitle=document.getElementById('ovTitle'),
    ovCap=document.getElementById('ovCap'), ovNote=document.getElementById('ovNote'),
    ovDate=document.getElementById('ovDate'), ovCounter=document.getElementById('ovCounter'),
    ovImgPos=document.getElementById('ovImgPos'), ovXLink=document.getElementById('ovXLink'),
    imgDots=document.getElementById('imgDots'),
    btnPrev=document.getElementById('btnPrevPost'), btnNext=document.getElementById('btnNextPost'),
    btnDl=document.getElementById('btnDownload');
var curPostIdx=-1, curImgIdx=0, lastFocus=null;

function visiblePos(){ for(var i=0;i<visible.length;i++){ if(visible[i].index===curPostIdx) return i; } return -1; }

function renderViewer(){
  var post=POSTS[curPostIdx]; if(!post) return;
  var single=hasSingle(post);
  if(single){
    curImgIdx=0;
    ovImg.src=singleSrc(post);
  }else{
    ovImg.src=origUrl(post.images[curImgIdx]);
  }
  ovImg.alt=[post.title,post.caption].filter(Boolean).join(' — ')||'投稿イラスト';
  ovTitle.textContent=post.title||''; ovTitle.style.display=post.title?'':'none';
  ovCap.textContent=post.caption||''; ovCap.style.display=post.caption?'':'none';
  ovNote.textContent=post.note||''; ovNote.style.display=post.note?'':'none';
  ovDate.textContent='📅 '+fmtDate(post.date);
  ovXLink.href=post.postUrl;
  var pos=visiblePos();
  ovCounter.textContent=(pos>=0?(pos+1)+' / '+visible.length:'');
  ovImgPos.textContent = single
    ? (isJoined(post) ? joinCols(post)+'分割を結合した1枚絵' : '結合した1枚絵')
    : (post.images.length>1 ? ('画像 '+(curImgIdx+1)+' / '+post.images.length) : '画像 1 / 1');
  btnPrev.disabled = !(pos>0);
  btnNext.disabled = !(pos>=0 && pos<visible.length-1);
  imgDots.innerHTML='';
  imgDots.style.display = (!single && post.images.length>1) ? 'flex':'none';
  if(!single){
    post.images.forEach(function(_,i){
      var b=document.createElement('button'); b.type='button'; b.textContent=(i+1);
      b.setAttribute('aria-current', i===curImgIdx?'true':'false');
      b.setAttribute('aria-label','画像'+(i+1)+'を表示');
      b.addEventListener('click', function(){ curImgIdx=i; renderViewer(); });
      imgDots.appendChild(b);
    });
  }
}
function openViewer(postIdx, imgIdx){
  curPostIdx=postIdx; curImgIdx=imgIdx||0; lastFocus=document.activeElement;
  overlay.classList.add('open'); document.body.style.overflow='hidden';
  renderViewer(); document.getElementById('btnClose').focus();
}
function closeViewer(){
  overlay.classList.remove('open'); document.body.style.overflow='';
  ovImg.removeAttribute('src');
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
function stepPost(dir){
  var pos=visiblePos(); if(pos<0) return;
  var np=pos+dir; if(np<0||np>=visible.length) return;
  curPostIdx=visible[np].index; curImgIdx=0; renderViewer();
}
document.getElementById('btnClose').addEventListener('click', closeViewer);
btnPrev.addEventListener('click', function(){ stepPost(-1); });
btnNext.addEventListener('click', function(){ stepPost(1); });
btnDl.addEventListener('click', function(){
  var post=POSTS[curPostIdx]; if(!post) return;
  if(hasSingle(post)) openLocalFile(singleSrc(post));
  else openOriginal(post.images[curImgIdx]);
});
overlay.addEventListener('click', function(e){ if(e.target===overlay) closeViewer(); });
document.addEventListener('keydown', function(e){
  if(!overlay.classList.contains('open')) return;
  if(e.key==='Escape') closeViewer();
  else if(e.key==='ArrowLeft') stepPost(-1);
  else if(e.key==='ArrowRight') stepPost(1);
});
/* スワイプで前後の投稿 */
var touchX=null;
overlay.addEventListener('touchstart', function(e){ touchX=e.changedTouches[0].clientX; }, {passive:true});
overlay.addEventListener('touchend', function(e){
  if(touchX===null) return;
  var dx=e.changedTouches[0].clientX-touchX; touchX=null;
  if(Math.abs(dx)>60) stepPost(dx<0?1:-1);
}, {passive:true});

renderChips();
renderGallery();
</script>
