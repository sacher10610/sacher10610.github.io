<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060a14">
  <meta name="description" content="SACHER10610 illustration gallery">
  <title>ILLUSTRATION — SACHER10610</title>
  <link rel="stylesheet" href="/css/ambient-room.css?v=20260912-1">
  <link rel="stylesheet" href="/css/illustration.css?v=20260912-2">
  <script src="/js/ambient-room.js?v=20260912-1" defer></script>
  <script src="/js/illustration.js?v=20260912-2" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#featured-gallery">作品一覧へ移動</a>

  <header class="gallery-header">
    <a class="gallery-brand" href="/" aria-label="SACHER10610 トップページへ戻る">
      <span>SACHER10610</span>
    </a>

    <div class="gallery-header__meta">
      <span aria-current="page">01 / ILLUSTRATION</span>
      <a href="/">← ROOM</a>
    </div>
  </header>

  <main>
    <section class="gallery-lead" aria-labelledby="gallery-title">
      <p class="gallery-lead__number" aria-hidden="true">01</p>
      <h1 id="gallery-title">ILLUSTRATION</h1>
      <div class="gallery-lead__subrow">
        <p class="gallery-lead__mode">FEATURED WORKS</p>
        <button class="gallery-view__all" type="button">
          VIEW ALL — <span class="gallery-total">000 WORKS</span>
        </button>
      </div>
    </section>

    <section class="gallery-view gallery-view--featured" aria-label="注目作品">
      <div class="gallery gallery--featured" id="featured-gallery"></div>

      <div class="gallery-view__switch">
        <button class="gallery-view__all" type="button">
          VIEW ALL — <span class="gallery-total">000 WORKS</span>
        </button>
      </div>
    </section>

    <section class="gallery-view gallery-view--full" aria-label="全作品一覧" hidden>
      <div class="full-gallery__bar">
        <div>
          <p class="full-gallery__eyebrow">GALLERY</p>
          <p class="full-gallery__count gallery-total">000 WORKS</p>
        </div>
        <button class="gallery-view__featured" type="button">← FEATURED</button>
      </div>

      <div class="gallery-filters" aria-label="作品カテゴリー"></div>
      <div class="gallery gallery--full" id="full-gallery"></div>
    </section>
  </main>

  <footer class="gallery-footer">
    <span>SACHER10610</span>
    <nav aria-label="フッターナビゲーション">
      <a href="/">ROOM</a>
      <a href="#top" aria-label="ページ上部へ戻る">↑</a>
    </nav>
  </footer>

  <dialog class="lightbox" aria-labelledby="lightbox-title">
    <div class="lightbox__inner">
      <button class="lightbox__close" type="button" aria-label="作品を閉じる">×</button>

      <div class="lightbox__stage">
        <div class="lightbox__media"></div>
      </div>

      <div class="lightbox__footer">
        <div class="lightbox__caption">
          <p class="lightbox__counter" aria-live="polite"></p>
          <h2 id="lightbox-title"></h2>
          <p class="lightbox__details"></p>
        </div>

        <div class="lightbox__actions">
          <div class="lightbox__zoom" role="group" aria-label="Zoom controls">
            <button class="lightbox__zoom-out" type="button" aria-label="Zoom out">−</button>
            <output class="lightbox__zoom-level" aria-label="Zoom level" aria-live="polite">100%</output>
            <button class="lightbox__zoom-in" type="button" aria-label="Zoom in">+</button>
            <button class="lightbox__zoom-reset" type="button" aria-label="Reset zoom">FIT</button>
          </div>

          <div class="lightbox__controls">
            <button class="lightbox__previous" type="button" aria-label="前の作品">←</button>
            <button class="lightbox__next" type="button" aria-label="次の作品">→</button>
          </div>
        </div>
      </div>
    </div>
  </dialog>
</body>
</html>
